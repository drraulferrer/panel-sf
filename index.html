<style>
  :root { color-scheme: light dark; }

  body {

    background: #0f172a; color: #e2e8f0;
  }
  .card {

    width: 100%; padding: .7rem .9rem; font-size: 1rem; letter-spacing: .08em;
    border: 1px solid #475569; border-radius: 10px;
    background: #0f172a; color: #e2e8f0; text-align: center;
  }
  input:focus { outline: 2px solid #38bdf8; border-color: transparent; }
  button {
    width: 100%; margin-top: .9rem; padding: .7rem; font-size: 1rem; font-weight: 600;
    border: 0; border-radius: 10px; background: #0ea5e9; color: #fff; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: wait; }
  .err { color: #f87171; font-size: .85rem; margin-top: .8rem; min-height: 1.2em; }
</style>

const ITER = 600000;

function b64ToBytes(b64) {
  const bin = atob(b64), out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function decrypt(password) {
  const data = b64ToBytes(PAYLOAD);
  const salt = data.slice(0, 16), iv = data.slice(16, 28), body = data.slice(28);
  const baseKey = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: ITER, hash: 'SHA-256' },
    baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, body);
  return new TextDecoder().decode(plain);
}

document.getElementById('f').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const btn = document.getElementById('go'), err = document.getElementById('err');
  err.textContent = '';
  btn.disabled = true; btn.textContent = 'Descifrando\u2026';
  try {
    const html = await decrypt(document.getElementById('pw').value);
    document.open(); document.write(html); document.close();
  } catch (e) {
    err.textContent = 'Contrase\u00f1a incorrecta.';
    btn.disabled = false; btn.textContent = 'Abrir';
    document.getElementById('pw').select();
  }
});
if (!(window.isSecureContext && crypto.subtle)) {
  document.getElementById('err').textContent =
    'Este navegador no permite descifrar aqu\u00ed (se necesita contexto seguro: https o fichero local).';
}
